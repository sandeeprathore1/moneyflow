# Run the API against a remote Supabase Postgres database.
# 1. Copy .env.supabase.example → .env and fill in Supabase credentials
# 2. docker compose -f docker-compose.supabase.yml up

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_SSL: "true"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && python -m scripts.seed_categories && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
